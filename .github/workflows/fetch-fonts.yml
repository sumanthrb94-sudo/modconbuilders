name: Fetch fonts

# Downloads Satoshi (Fontshare, free for commercial use under the ITF Free Font License)
# into app/fonts/ (loaded by app/fonts.ts) and commits it. Satoshi isn't on Google Fonts,
# so it's self-hosted. Run it manually from the Actions tab to update the font.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download Satoshi
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/satoshi.zip" "https://api.fontshare.com/v2/fonts/download/satoshi"
          unzip -q "$tmp/satoshi.zip" -d "$tmp/satoshi"
          find "$tmp/satoshi" -path '*WEB*' -name 'Satoshi-Variable*.woff2' -exec cp {} app/fonts/ \;
          ls -la app/fonts

      - name: Commit fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/fonts
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add Satoshi web fonts from Fontshare"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1
